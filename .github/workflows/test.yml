name: Website Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          echo "Website files exist. Test passed!"
